<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f5f2; --panel: #ffffff; --ink: #1c1f1d; --muted: #6b716c; --line: #e2e4df;
    --accent: #0f7b5f; --accent-ink: #ffffff; --path: #0f7b5f; --warn: #b4540a; --row: #fafbf9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121513; --panel: #1b1f1c; --ink: #e8ebe8; --muted: #959c96; --line: #2c322e;
      --accent: #3fbf95; --accent-ink: #0d1a14; --path: #3fbf95; --warn: #f0a050; --row: #181c19;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .dot.stale { background: var(--warn); }
  .spacer { flex: 1; }
  select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }

  .mapbox { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #map { height: 62vh; min-height: 340px; background: var(--panel); }
  .maptools { position: absolute; z-index: 500; top: 10px; right: 10px; display: flex; gap: 6px; }
  .maptools button { box-shadow: 0 1px 4px rgba(0,0,0,.18); padding: 6px 10px; font-size: 13px; }
  .maptools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .empty { position: absolute; inset: 0; z-index: 400; display: none; place-items: center; text-align: center;
           background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--muted); padding: 20px; }
  .empty.show { display: grid; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 5px; }

  .log { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .loghead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .loghead h2 { margin: 0; font-size: 16px; }
  .loghead small { color: var(--muted); }
  .tablewrap { max-height: 480px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12px;
       text-transform: uppercase; letter-spacing: .05em; }
  tbody tr:nth-child(even) { background: var(--row); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
  td.srv { color: var(--warn); }
  .more { display: block; margin: 10px auto 14px; }
  .err { color: var(--warn); font-size: 13px; }

  .pin { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid #fff;
         box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.35); position: relative; }
  .pin::after { content: ""; position: absolute; inset: -10px; border-radius: 50%;
                border: 2px solid var(--accent); animation: ping 2s ease-out infinite; }
  @keyframes ping { from { opacity: .7; transform: scale(.5); } to { opacity: 0; transform: scale(1.3); } }
  @media (prefers-reduced-motion: reduce) { .pin::after { animation: none; display: none; } }

  @media (max-width: 600px) {
    .wrap { padding: 12px; }
    th, td { padding: 7px 10px; }
    #map { height: 52vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GPS Tracker</h1>
    <span class="live"><span class="dot" id="dot"></span><span id="seen">Waiting for data…</span></span>
    <span class="spacer"></span>
    <label for="device" class="live">Device</label>
    <select id="device" aria-label="Device"><option value="">—</option></select>
  </header>

  <div class="stats">
    <div class="stat"><span>Last fix</span><b id="s-time">—</b></div>
    <div class="stat"><span>Position</span><b id="s-pos">—</b></div>
    <div class="stat"><span>Speed</span><b id="s-spd">—</b></div>
    <div class="stat"><span>Battery</span><b id="s-bat">—</b></div>
    <div class="stat"><span>Distance</span><b id="s-dist">—</b></div>
    <div class="stat"><span>Points</span><b id="s-count">0</b></div>
  </div>

  <div class="mapbox">
    <div id="map"></div>
    <div class="maptools">
      <button id="follow" aria-pressed="true" title="Keep the latest position in view">Follow</button>
      <button id="fit" title="Show the whole path">Fit path</button>
    </div>
    <div class="empty show" id="empty">
      <div>
        <strong>No points yet</strong><br>
        Send one with<br><code>/api/ingest?key=…&amp;d=trk01,30.9010,75.8573,0,90,0</code>
      </div>
    </div>
  </div>

  <section class="log">
    <div class="loghead">
      <h2>Location log</h2>
      <small id="logcount"></small>
      <span class="spacer"></span>
      <span class="err" id="err"></span>
      <button class="primary" id="download" disabled>Download .txt</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th>Time</th><th>Latitude</th><th>Longitude</th><th>Speed</th><th>Battery</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <button class="more" id="more" hidden>Show older entries</button>
    </div>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const POLL_MS = 10000;
  const PAGE = 300;                       // log rows rendered per "show more"
  const params = new URLSearchParams(location.search);
  const viewKey = params.get('key') || '';
  const $ = (id) => document.getElementById(id);

  let device = params.get('device') || '';
  let points = [];                        // sorted by ts ascending
  let lastSeq = 0, shown = PAGE, follow = true, firstFit = true, timer;

  // ---- map ----
  const map = L.map('map', { zoomControl: true }).setView([22.5, 79], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  const pathColor = getComputedStyle(document.documentElement).getPropertyValue('--path').trim() || '#0f7b5f';
  const path = L.polyline([], { color: pathColor, weight: 4, opacity: .85 }).addTo(map);
  const start = L.circleMarker([0, 0], { radius: 6, color: '#fff', weight: 2, fillColor: '#555', fillOpacity: 1 });
  const pin = L.marker([0, 0], { icon: L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) });
  map.on('dragstart', () => setFollow(false));

  // ---- helpers ----
  const api = (url) => fetch(url + (viewKey ? `${url.includes('?') ? '&' : '?'}key=${encodeURIComponent(viewKey)}` : ''), { cache: 'no-store' })
    .then((r) => r.ok ? r.json() : r.json().catch(() => ({})).then((j) => Promise.reject(new Error(j.error || `HTTP ${r.status}`))));
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (ts) => { const d = new Date(ts * 1000);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const tz = (() => { const o = -new Date().getTimezoneOffset(), s = o >= 0 ? '+' : '-', a = Math.abs(o);
    return `UTC${s}${pad(Math.floor(a / 60))}:${pad(a % 60)}`; })();
  const ago = (ms) => { const s = Math.round((Date.now() - ms) / 1000);
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
  const hav = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h)); };
  const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function setFollow(v) { follow = v; $('follow').setAttribute('aria-pressed', String(v)); }

  // ---- render ----
  function render() {
    const n = points.length;
    $('empty').classList.toggle('show', n === 0);
    $('download').disabled = n === 0;
    $('s-count').textContent = n.toLocaleString();
    $('logcount').textContent = n ? `${n.toLocaleString()} entries · times in ${tz}` : '';

    const latlngs = points.map((p) => [p.lat, p.lon]);
    path.setLatLngs(latlngs);
    if (!n) { map.removeLayer(pin); map.removeLayer(start); renderRows(); return; }

    const last = points[n - 1];
    pin.setLatLng([last.lat, last.lon]).addTo(map)
       .bindPopup(`<b>${esc(device)}</b><br>${fmt(last.ts)}<br>${last.lat.toFixed(6)}, ${last.lon.toFixed(6)}`
                + (last.spd != null ? `<br>${last.spd} km/h` : ''));
    start.setLatLng(latlngs[0]).addTo(map).bindTooltip('Start');

    let dist = 0;
    for (let i = 1; i < n; i++) dist += hav(points[i - 1], points[i]);
    $('s-dist').textContent = dist < 1 ? `${Math.round(dist * 1000)} m` : `${dist.toFixed(dist < 100 ? 2 : 0)} km`;
    $('s-time').textContent = fmt(last.ts).slice(11);
    $('s-pos').textContent = `${last.lat.toFixed(5)}, ${last.lon.toFixed(5)}`;
    $('s-spd').textContent = last.spd != null ? `${last.spd} km/h` : '—';
    $('s-bat').textContent = last.bat != null ? `${last.bat}%` : '—';

    if (firstFit) { firstFit = false; n > 1 ? map.fitBounds(path.getBounds(), { padding: [30, 30], maxZoom: 17 }) : map.setView([last.lat, last.lon], 16); }
    else if (follow) map.panTo([last.lat, last.lon]);
    renderRows();
  }

  function renderRows() {
    const n = points.length, rows = [];
    for (let i = n - 1; i >= Math.max(0, n - shown); i--) {
      const p = points[i];
      rows.push(`<tr data-i="${i}"><td>${i + 1}</td><td class="${p.srv ? 'srv' : ''}" title="${p.srv ? 'Device sent no valid time; server arrival time used' : ''}">${fmt(p.ts)}</td>`
        + `<td>${p.lat.toFixed(6)}</td><td>${p.lon.toFixed(6)}</td>`
        + `<td>${p.spd != null ? p.spd + ' km/h' : '—'}</td><td>${p.bat != null ? p.bat + '%' : '—'}</td></tr>`);
    }
    $('rows').innerHTML = rows.join('');
    $('more').hidden = n <= shown;
  }

  $('rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const p = points[+tr.dataset.i]; setFollow(false);
    map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16));
    L.popup().setLatLng([p.lat, p.lon]).setContent(`#${+tr.dataset.i + 1}<br>${fmt(p.ts)}`).openOn(map);
    $('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  $('more').onclick = () => { shown += PAGE; renderRows(); };
  $('follow').onclick = () => { setFollow(!follow); if (follow && points.length) { const l = points.at(-1); map.panTo([l.lat, l.lon]); } };
  $('fit').onclick = () => { if (points.length > 1) { setFollow(false); map.fitBounds(path.getBounds(), { padding: [30, 30] }); } };

  $('download').onclick = () => {
    const lines = [
      `# GPS log for device ${device}`,
      `# Exported ${fmt(Date.now() / 1000)} (${tz})`,
      `# time (${tz}), latitude, longitude, speed_kmh, battery_pct`,
      ...points.map((p) => `${fmt(p.ts)}, ${p.lat.toFixed(7)}, ${p.lon.toFixed(7)}, ${p.spd ?? ''}, ${p.bat ?? ''}`)
    ];
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gps-log-${device}-${fmt(Date.now() / 1000).slice(0, 10)}.txt`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // ---- data ----
  async function loadDevices() {
    const { devices } = await api('/api/devices');
    const sel = $('device');
    sel.innerHTML = devices.length ? devices.map((d) => `<option value="${esc(d.id)}">${esc(d.id)}</option>`).join('') : '<option value="">—</option>';
    if (!device || !devices.some((d) => d.id === device)) device = devices[0]?.id || '';
    sel.value = device;
    return devices;
  }

  function insert(newPts) {
    for (const p of newPts) {
      lastSeq = Math.max(lastSeq, p.seq);
      let i = points.length;                          // usually appended at the end
      while (i > 0 && points[i - 1].ts > p.ts) i--;
      points.splice(i, 0, p);
    }
  }

  async function poll() {
    clearTimeout(timer);
    try {
      const devices = await loadDevices();
      if (device) {
        const data = await api(`/api/points?device=${encodeURIComponent(device)}&after=${lastSeq}`);
        if (data.firstSeq && points.length && data.firstSeq > points[0].seq) {
          points = points.filter((p) => p.seq >= data.firstSeq);   // server trimmed old points
        }
        if (data.points.length) { insert(data.points); render(); }
        const d = devices.find((x) => x.id === device);
        if (d) {
          const age = Date.now() - d.rx;
          $('dot').className = 'dot ' + (age < 15 * 60e3 ? 'on' : 'stale');
          $('seen').textContent = `Last heard ${ago(d.rx)}`;
        }
      }
      $('err').textContent = '';
    } catch (e) {
      $('err').textContent = e.message === 'view key required' ? 'Add ?key=YOUR_VIEW_KEY to the page address' : `Update failed: ${e.message}`;
    }
    if (!document.hidden) timer = setTimeout(poll, POLL_MS);
  }

  $('device').onchange = (e) => {
    device = e.target.value; points = []; lastSeq = 0; shown = PAGE; firstFit = true; setFollow(true);
    const u = new URL(location); u.searchParams.set('device', device); history.replaceState(null, '', u);
    render(); poll();
  };

  // Don't poll from a hidden tab: saves database requests on the free tier.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(timer); else poll();
  });

  render();
  poll();
})();
</script>
</body>
</html>
